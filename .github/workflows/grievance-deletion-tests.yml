name: Grievance deletion tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify closed-only admin deletion safeguards
        run: bash ./mvnw -B -Dtest=GrievanceDeletionTests test
