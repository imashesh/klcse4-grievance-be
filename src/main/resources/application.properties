spring.application.name=cse4grievance

server.port=${SERVER_PORT:8080}

# MySQL Configuration — env vars override for Railway, defaults for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cse4grievance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hibernate automatically detects MySQL dialect
# Do NOT use MySQL8Dialect in Spring Boot 4

spring.jpa.open-in-view=false

# Fail closed in production. Enable only after verifying a recoverable DB backup.
grievances.admin-deletion.enabled=${GRIEVANCE_ADMIN_DELETE_ENABLED:false}
grievances.admin-deletion.security-key=${GRIEVANCE_ADMIN_DELETE_SECURITY_KEY:}
